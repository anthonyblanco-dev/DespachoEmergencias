name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y empaquetar
        run: mvn -B -ntp package

      - name: Pruebas de las estructuras de datos
        run: |
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          CP="target/classes:$(cat cp.txt)"
          for prueba in PruebaGrafo PruebaTablaHash PruebaArbolBMas PruebaArbolRojoNegro PruebaDespacho; do
            echo "=== $prueba ==="
            java -cp "$CP" "com.cenfotec.despacho.pruebas.$prueba"
          done

      - name: Publicar el jar ejecutable (despliegue)
        uses: actions/upload-artifact@v4
        with:
          name: despacho-emergencias-jar
          path: target/*-jar-with-dependencies.jar
